<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kobi soundbank</title>
<style>
  :root { --bg: #16181d; --panel: #1f2229; --fg: #e8e6e1; --muted: #8a8f99; --accent: #e0a458; --line: #2c3038; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  header { padding: 18px 24px 8px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
  header .stats { color: var(--muted); }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 8px 24px 24px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  #programs { max-height: 70vh; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
  #programs button { text-align: left; background: none; border: 0; color: var(--fg); padding: 5px 8px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; font: inherit; }
  #programs button:hover { background: #2a2e37; }
  #programs button.selected { background: #33383f; outline: 1px solid var(--accent); }
  #programs button .size { color: var(--muted); font-variant-numeric: tabular-nums; }
  #programs button.loaded .size { color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  button.action { background: var(--accent); color: #1a1a1a; border: 0; border-radius: 6px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  button.action[disabled] { opacity: 0.45; cursor: default; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  #keys { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 8px; }
  #keys button { width: 34px; height: 64px; border-radius: 4px; border: 1px solid var(--line); background: #e8e6e1; color: #333; font: 11px system-ui; cursor: pointer; }
  #keys button.black { background: #2a2d34; color: #bbb; height: 44px; }
  #keys button:active, #keys button.down { background: var(--accent); }
  progress { width: 100%; height: 8px; accent-color: var(--accent); }
  .log { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; max-height: 160px; overflow: auto; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>kobi soundbank</h1>
  <span class="stats" id="stats">loading manifest…</span>
</header>
<main>
  <section class="panel">
    <h2>Programs <span id="bankname"></span></h2>
    <div id="programs"></div>
  </section>
  <section>
    <div class="panel" style="margin-bottom:16px">
      <h2>Play <span id="selname">—</span></h2>
      <div class="row">
        <button class="action" id="arp">Arpeggio</button>
        <span class="stats">Click the keys, use A–K on the keyboard, or plug in a MIDI keyboard.</span>
      </div>
      <div id="keys"></div>
    </div>
    <div class="panel">
      <h2>MIDI file</h2>
      <div class="row">
        <input type="file" id="file" accept=".mid,.midi,audio/midi">
        <button class="action" id="play" disabled>Play</button>
        <button class="ghost" id="stop" disabled>Stop</button>
        <span class="stats" id="midiinfo"></span>
      </div>
      <progress id="pos" value="0" max="1"></progress>
      <div class="log" id="log"></div>
    </div>
  </section>
</main>
<script type="module">
  import { KobiBank } from './kobi-player.js';
  import { MidiPlayer } from './kobi-midi.js';

  const params = new URLSearchParams(location.search);
  const bank = await KobiBank.open(params.get('bank') || '../kobi_slim/');
  const player = new MidiPlayer(bank);
  window.kobiDemo = { bank, player };          // for the console and the tests

  const $ = (id) => document.getElementById(id);
  const kb = (n) => (n / 1024).toFixed(0) + ' KB';
  const log = (s) => { $('log').textContent = (s + '\n' + $('log').textContent).slice(0, 4000); };
  let selected = 0;

  function stats() {
    const s = bank.stats;
    $('stats').textContent = `${s.programs} programs loaded · ${kb(s.bytes)} fetched · ${s.voices} voices`;
  }
  bank.onload = (id, prog) => {
    const b = document.querySelector(`#programs button[data-id="${id}"]`);
    if (b) { b.classList.add('loaded'); }
    stats();
    log(`loaded ${prog.name}: ${prog.regions.length} regions, ${prog.files} files`);
  };

  let man;
  try {
    man = await bank.manifest();
  } catch (e) {
    // a file:// URL, or a server whose root does not contain the bank folder, ends up here
    $('stats').textContent = `could not load ${new URL('GM/manifest.json', bank.url).href}: ${e.message}. Serve the repository root (python3 kobi_web/test/rangeserver.py 8080) and open /kobi_web/.`;
    throw e;
  }
  $('bankname').textContent = `· ${man.name}, ${(man.total_bytes / 1e6).toFixed(1)} MB total`;
  const list = $('programs');
  const entries = Object.entries(man.programs).map(([id, e]) => [id, e]).concat([['drums', man.drums]]);
  for (const [id, e] of entries) {
    const b = document.createElement('button');
    b.dataset.id = id;
    b.innerHTML = `<span>${id === 'drums' ? 'Drums' : id.padStart(3, '0') + ' ' + e.name}</span><span class="size">${kb(e.bytes)}</span>`;
    b.onclick = () => select(id);
    list.appendChild(b);
  }
  stats();

  async function select(id) {
    selected = id === 'drums' ? 'drums' : Number(id);
    document.querySelectorAll('#programs button').forEach((b) => b.classList.toggle('selected', b.dataset.id === String(id)));
    $('selname').textContent = id === 'drums' ? 'Drums' : man.programs[id].name;
    await bank.load(selected);
    buildKeys();
  }

  function buildKeys() {
    const keys = $('keys');
    keys.innerHTML = '';
    const isDrums = selected === 'drums';
    const from = isDrums ? 35 : 48, to = isDrums ? 81 : 84;
    for (let k = from; k <= to; k++) {
      const b = document.createElement('button');
      const black = [1, 3, 6, 8, 10].includes(k % 12);
      b.className = black ? 'black' : '';
      b.textContent = isDrums ? k : (k % 12 === 0 ? 'C' + (k / 12 - 1) : '');
      b.dataset.key = k;
      b.onpointerdown = () => { bank.ctx.resume(); b._h = bank.noteOn(selected, k, 100); b.classList.add('down'); stats(); };
      const up = () => { if (b._h) { bank.noteOff(b._h); b._h = null; } b.classList.remove('down'); };
      b.onpointerup = up; b.onpointerleave = up;
      keys.appendChild(b);
    }
  }

  $('arp').onclick = async () => {
    await bank.ctx.resume();
    await bank.load(selected);
    const t0 = bank.ctx.currentTime + 0.05;
    const isDrums = selected === 'drums';
    const notes = isDrums ? [36, 42, 38, 42, 36, 36, 38, 49] : [60, 64, 67, 72, 67, 64, 60];
    notes.forEach((k, i) => {
      const h = bank.noteOn(selected, k, 100, { when: t0 + i * 0.25 });
      if (h) bank.noteOff(h, k, t0 + i * 0.25 + (isDrums ? 0.1 : 0.22));
    });
    if (!isDrums) {
      const t1 = t0 + notes.length * 0.25 + 0.1;
      [60, 64, 67, 72].forEach((k) => { const h = bank.noteOn(selected, k, 110, { when: t1 }); if (h) bank.noteOff(h, k, t1 + 1.6); });
    }
    stats();
  };

  // computer keyboard: A S D F G H J K = C D E F G A B C, W E T Y U = sharps
  const map = { a: 60, w: 61, s: 62, e: 63, d: 64, f: 65, t: 66, g: 67, y: 68, h: 69, u: 70, j: 71, k: 72 };
  const down = {};
  addEventListener('keydown', (ev) => {
    if (ev.repeat || !(ev.key in map) || ev.target.tagName === 'INPUT') return;
    bank.ctx.resume(); down[ev.key] = bank.noteOn(selected, map[ev.key], 100); stats();
  });
  addEventListener('keyup', (ev) => { if (down[ev.key]) { bank.noteOff(down[ev.key]); delete down[ev.key]; } });

  // Web MIDI input, if the browser and hardware allow
  if (navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess().then((access) => {
      const held = new Map();
      for (const input of access.inputs.values()) {
        input.onmidimessage = (m) => {
          const [st, a, b] = m.data, type = st & 0xf0;
          if (type === 0x90 && b > 0) { bank.ctx.resume(); held.set(a, bank.noteOn(selected, a, b)); }
          else if (type === 0x80 || type === 0x90) { const h = held.get(a); if (h) { bank.noteOff(h); held.delete(a); } }
        };
        log(`MIDI input: ${input.name}`);
      }
    }, () => {});
  }

  // MIDI file playback
  $('file').onchange = async () => {
    const f = $('file').files[0];
    if (!f) return;
    $('play').disabled = true; $('midiinfo').textContent = 'parsing…';
    const info = await player.load(await f.arrayBuffer());
    $('midiinfo').textContent = `${f.name}: ${info.duration.toFixed(0)} s, programs ${info.programs.join(', ')}`;
    $('play').disabled = false;
    $('pos').max = info.duration;
    stats();
  };
  player.onprogress = (t, d) => { $('pos').value = t; };
  player.onend = () => { $('stop').disabled = true; $('play').disabled = false; };
  $('play').onclick = () => { player.play(); $('stop').disabled = false; $('play').disabled = true; };
  $('stop').onclick = () => { player.stop(); $('stop').disabled = true; $('play').disabled = false; };

  select(0);
</script>
</body>
</html>
